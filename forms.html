<!--The form element in HTML is used to gather user information, such as names and email 
addresses. Here is an example of a form element:-->

<form action="url-goes-here">
  <!-- input elements go here -->
</form>

<!--The action attribute specifies where the form data will be sent upon submission. 
To collect specific information, like names and email addresses, you would use the input 
element. Here is an example of using an input element.

Interact with the input element in the preview window by typing in your name in the field. -->

<form action="">
  <input type="text" />
</form>

<!-- input elements are void elements and do not have closing tags. The type attribute 
 defines the data type expected from the user. In this case, the data would be plaintext. 
 To add a label for the input, you would use a label element. Here is an example of using 
 a label element with the text of Full Name:.

Click on the text Full Name: in the preview window and you will see the input go into 
focus.-->

<form action="">
  <label>
    Full Name:
    <input type="text" />
  </label>
</form>

<!-- By nesting an input inside a label element, you create an implicit association 
 between the label and the input field. The term "implicit" refers to something that is 
 understood or inferred without needing to be explicitly stated or defined with additional
  attributes or elements. To explicitly associate a label with an input, you can use the 
  for attribute. Here is an example of using the for attribute for an email address label.

Interact with the input element in the preview window by typing in a fake email address 
like jane@example.com. -->

<form action="">
  <label for="email">Email Address:</label>
  <input type="email" id="email" />
</form>

<!--When using an explicit association, the values for the for attribute and id need to 
be the same. In this case, the values are both set to email. The email type in the input 
provides basic validation for correctly formatted email addresses. If you want to show 
additional hints to the users about the expected input, you can use the placeholder 
attribute. Here is an example using the placeholder attribute inside the email input.

Click on the email input and start typing in an email and you will see the placeholder 
text go away.-->

<form action="">
  <label for="email">Email Address:</label>
  <input
    type="email"
    id="email"
    placeholder="example@email.com"
  />
</form>

<!-- The button element is used to perform a particular action when it is activated. Here 
 is an example of a button element with the button text of Start Game.-->

 <button>Start Game</button>

 <!--Other examples of using the button element include submitting a form, showing a modal,
  or toggling a side menu open and closed. The button element has a type attribute which 
  controls the behavior of the button when it is activated. The first possible value for 
  the type attribute would be the button type. Here is an example of using the button 
  element with the button type and a text of Show Alert: -->

  <button type="button">Show Alert</button>

  <!--By default, the button will not do anything when activated. However, you can add 
  some JavaScript code to make the button interactive, such as showing an alert in this 
  case.

Click on the Show Alert button to see an alert pop up on the screen.

NOTE: This interactive example is using JavaScript but you don't need to worry about 
understanding the JavaScript code. You will learn about JavaScript in future modules.-->

<button type="button">Show Alert</button>
<script src="index.js"></script>

<!-- index.js

 const btn = document.querySelector("button");
btn.addEventListener("click", () => alert("You clicked on the alert button"));

-->

<!--Another possible value for the type attribute is the submit value. Here is an example 
of using a button element with the submit type.-->

<form action="">
  <label for="email">Email address:</label>
  <input type="email" id="email" name="email" />
  <button type="submit">Submit form</button>
</form>

<!--Inside this form element, there is a label and input element for the user's email 
address. When the user clicks on the submit button, their data will be sent to the server 
and will be processed. The third possible value for the type attribute is the reset value. Here is an example of a form element with reset and submit buttons.

Interact with the email input in the preview window by providing a fake email address. 
Then click on the reset button to see your email disappear from the field.-->

<form action="">
  <label for="email">Email address:</label>
  <input type="email" id="email" name="email" />
  <button type="reset">Reset form</button>
  <button type="submit">Submit form</button>
</form>

<!--In this modified example, a label and input element are used to collect the user's 
email address. When the user clicks on the reset button, then it will clear out all of 
their input data. It is important to note that reset buttons are usually not the best 
idea because they could lead to users accidentally resetting their data. Also, multiple 
buttons in your form could clutter up the user interface.

Another way to create buttons in HTML is to use the input element. The input element also 
has a type attribute with the possible values of submit, reset, and button. Here is an 
example of using the input element with the type set to button:-->

<input class="start-btn" type="button" value="Start Game" />
<script src="index.js"></script>

<!--The value attribute is used to show the button text. So, what is the difference 
between using the input and button elements? input elements are void elements, which 
means they cannot have child nodes, such as text, and can only have a start tag. On the 
other hand, the button element offers more flexibility because you can nest text, images,
 and icons inside it.-->

 <!--One common example of built-in form validation is to use the required attribute in 
 inputs. The required attribute specifies that the user needs to fill out that portion of 
 the form before it gets submitted. Here is an example of using the required attribute in 
 an email input.

Click on the Submit Form button without providing an email address and you will see a 
message pop up telling you to fill out the field.-->

<form action="">
  <label for="email">Email Address (Required field):</label>
  <input required type="email" name="email" id="email" />
  <button type="submit">Submit Form</button>
</form>

<!--Another advantage of using the email input is that email inputs have some basic 
validation to ensure correctly formatted email addresses. For example, if you type in 
random words and click submit, then the browser will show an alert that an @ sign is 
missing.

Type abc into the email field and click on the submit button. You should see a message 
pop up because it is not a valid email address.-->

<form action="">
  <label for="email">Email Address (Required field):</label>
  <input required type="email" name="email" id="email" />
  <button type="submit">Submit Form</button>
</form>

<!--Other forms of validation for email inputs are to use the minlength and maxlength 
attributes. Here is an example using the extra validation.

Type b@m in the field and click on the submit button. You will see a message pop up 
because it doesn't meet the minimum required length.-->

<form action="">
  <label for="email">Email Address (Required field):</label>
  <input
    required
    type="email"
    name="email"
    id="email"
    minlength="4"
    maxlength="64"
  />
  <button type="submit">Submit Form</button>
</form>

<!--In HTML, form controls, like inputs, can be in different stages or conditions like a 
focused state, readonly state, or disabled state.

The first state would be considered the default state. The default state of an email 
address input is a blank input. That is what the email input looks like when it is first 
rendered on the page.-->

<input type="email" name="email" id="email" />

<!--Another form state is the disabled state. This state shows users that an input cannot 
be focused or activated.

Try clicking on the email input and you will notice that it will not focus anymore.-->

<input disabled type="email" name="email" id="email" />

<!--Another type of form state is the readonly state. This is when a form control, like 
an input, is not editable by the user. Here is an example of setting an email input to 
read-only. The value attribute is used to set the value shown inside the input field.

Try editing the current value of example@email.com in the preview window, and you will 
notice that is not possible.-->

<input readonly type="email" name="email" id="email" value="example@email.com" />
