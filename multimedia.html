<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multimedia Player</title>
</head>

<body>
<h1>Multimedia Player</h1>
<section>
<h2>title</h2>
<audio controls aria-label="descriptive label goes here">
  <source src="https://cdn.freecodecamp.org/curriculum/js-music-player/sailing-away.mp3" type="audio/mpeg">
</audio>
</section>
<section>  
<h2>title</h2>
<video width="320" height="240" controls aria-label="descriptive label goes here">
  <source src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.mp4" type="video/mp4">
  <track kind="captions" srclang="en" label="English captions" src="captions.vtt" default>
  Your browser does not support the video tag.
</video> 
    </section>  
    <section>
<h2>transcript</h2>
<p>transcript</p>
    </section>
</body>

</html>
