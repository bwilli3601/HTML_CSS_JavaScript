<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Survey Form</title>
  </head>

  <body>
    <header>
      <h1 id="title">Customer Satisfaction Survey</h1>
      <p id="description">We value your feedback! Please take a moment to complete our survey.</p>
    </header>
    <main>
      <form action="https://survey-form.freecodecamp.org" method="POST" id="survey-form">
        <fieldset>
        <input required type="text" id="name" placeholder="Full Name"/>
        <label for="name" id="name-label">Name</label> <br />
        <input required type="email" id="email" placeholder="example@email.com" />
        <label for="email" id="email-label">Email</label> <br />
        <input type="number" id="number" min="10" max="100" placeholder="10"/>
        <label for="number" id="number-label">Age (optional)</label> <br />
        </fieldset>
        <fieldset>
            <legend>Current Role?</legend>
            <select id="dropdown" name="role">
                <option value="student">Student</option>
                <option value="full-time-job">Full Time Job</option>
                <option value="full-time-learner">Full Time Learner</option>
                <option value="prefer-not-to-say">Prefer not to say</option>
                <option value="other">Other</option>
            </select>
        </fieldset>
        <fieldset>
            <legend>How likely is that you would recommend our company to a friend?</legend>
            <input type="radio" id="definitely" name="recommendation" value="definitely" />
            <label for="definitely">Definitely</label>
            <input type="radio" id="maybe" name="recommendation" value="maybe" />
            <label for="maybe">Maybe</label>
            <input type="radio" id="not-sure" name="recommendation" value="not-sure" />
            <label for="not-sure">Not Sure</label>
        </fieldset>
        <fieldset>
            <legend>What do you like most about our company? (Check all that apply)</legend>
            <input type="checkbox" id="customer-service" name="like" value="customer-service" />
            <label for="customer-service">Customer Service</label>
            <input type="checkbox" id="product-quality" name="like" value="product-quality" />
            <label for="product-quality">Product Quality</label>
            <input type="checkbox" id="pricing" name="like" value="pricing" />
            <label for="pricing">Pricing</label>
            <input type="checkbox" id="variety" name="like" value="variety" />
            <label for="variety">Variety</label>
            <input type="checkbox" id="other-like" name="like" value="other-like" />
            <label for="other-like">Other</label>
        </fieldset>
        <fieldset>
            <legend>Any additional comments or suggestions?</legend>
            <textarea id="comments" name="comments" rows="4" cols="50" placeholder="Your comments here..."></textarea>
        </fieldset>
        <button type="submit" id="submit">Submit</button>
      </form>
    </main>
  </body>
</html>
